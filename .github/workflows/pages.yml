name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Type-check (site and Neon Function)
        run: npx tsc --noEmit
      - name: Bundle the Neon Function (deployed separately; see README)
        run: npm run api:build
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /cake-game
          # Public URL of the Neon Function "api" on the production branch
          NEXT_PUBLIC_API_URL: https://br-sparkling-tooth-bijr1t13-api.compute.c-5.ap-southeast-1.aws.neon.tech
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
